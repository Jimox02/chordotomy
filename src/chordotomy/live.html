<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harmonic Atlas · 实时和弦</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;background:#0c1017;color:#dfe5ee}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;border-bottom:1px solid #26303e;display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;margin:0;letter-spacing:.03em}header small{color:#8593a8}main{max-width:1200px;margin:32px auto;padding:0 24px}.toolbar,.panel{background:#121923;border:1px solid #273142;border-radius:10px}.toolbar{padding:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,button{font:inherit;background:#1c2634;color:#dfe5ee;border:1px solid #39475b;border-radius:6px;padding:10px 14px}select{flex:1;min-width:230px}button{cursor:pointer}button.primary{background:#56d9ac;color:#071a14;border-color:#56d9ac;font-weight:600}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin:20px 0}.panel{padding:25px}h2{font-size:12px;letter-spacing:.12em;color:#8998ad;font-weight:500;margin:0 0 22px}.chord{font-size:84px;line-height:1.2;font-weight:550;letter-spacing:-.04em;margin:18px 0}.tag{display:inline-block;background:#203448;color:#8bbdf1;font-size:12px;border-radius:4px;padding:5px 9px}.muted{color:#8998ad;font-size:13px;line-height:1.8}.row{display:flex;justify-content:space-between;margin:17px 0}.meter{height:6px;background:#293343;border-radius:9px;overflow:hidden}.meter div{height:100%;width:0;background:#56d9ac;transition:width .2s}.candidates{display:flex;gap:10px;flex-wrap:wrap}.candidate{padding:9px 15px;border:1px solid #354155;border-radius:5px}.timeline{display:flex;gap:8px;overflow:auto;padding:6px 0;min-height:86px}.segment{flex:0 0 92px;background:#1b2b39;border-top:2px solid #56d9ac;border-radius:4px;padding:12px;font-size:18px}.segment small{display:block;font-size:11px;color:#8798ac;margin-top:9px}#message{margin:12px 0;min-height:22px;color:#f2be77;font-size:13px}.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:18px}.dot{color:#56d9ac} @media(max-width:700px){.grid{grid-template-columns:1fr}.chord{font-size:64px}header small{display:none}}
</style>
<header><h1><span class="dot">◈</span> Harmonic Atlas <small> / 实时和弦测试</small></h1><span id="status" class="tag">连接中</span></header>
<main><div class="toolbar"><select id="device" aria-label="播放设备"><option value="">系统默认播放设备</option></select><button id="refresh">刷新设备</button><button id="start" class="primary">开始监听</button><button id="stop" disabled>停止</button><button id="demo">演示模式</button></div><div id="message" role="status"></div>
<div class="grid"><section class="panel"><h2>当前和弦 / CURRENT CHORD</h2><span id="stability" class="tag">等待音频</span><div class="chord" id="chord">—</div><p class="muted" id="window">播放音乐后开始监听系统声音</p><div class="candidates" id="candidates"></div></section><section class="panel"><h2>输入监测 / INPUT</h2><div class="row"><span class="muted">音量电平</span><span id="level">— dBFS</span></div><div class="meter"><div id="meter"></div></div><div class="row"><span class="muted">音频时长</span><span id="elapsed">00:00</span></div><div class="row"><span class="muted">丢弃音频块</span><span id="dropped">0</span></div><p class="muted">实时 DSP 预览 · 1 秒窗口<br>候选按匹配程度排序，不是概率。<br>高级和声分析将在后续阶段加入。</p></section></div>
<section class="panel"><h2>和弦时间线 / TIMELINE</h2><div class="timeline" id="timeline"><p class="muted">识别到的和弦变化将在这里显示</p></div><div class="footer"><span class="muted">本机会话 · 最多保留 600 次变化 · 不保存原始录音</span><button id="export" disabled>导出时间线</button></div></section><p class="muted">演示模式使用合成和弦，不读取系统声音，也不会播放声音。关闭页面会请求停止监听；退出服务请在终端按 Ctrl+C。</p></main>
<script>
const $=id=>document.getElementById(id);let state=null,busy=false,lastArrival=0,lastAudio=-1;
const names={idle:'就绪',starting:'正在打开设备',listening:'监听中',demo:'演示中',stopping:'正在停止',stopped:'已停止',error:'出错'};
function chordName(s){if(s==='N')return '无和弦';const [root,q]=s.split(':');const suffix={maj:'',min:'m',maj7:'maj7',min7:'m7',min6:'m6',hdim7:'ø7',dim7:'°7',dim:'°',aug:'+',sus4:'sus4',sus2:'sus2','sus4(b7)':'7sus4'};return root+(suffix[q]??q)}
function time(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data}
function text(el,value){el.textContent=value}
function render(s){state=s;const active=['starting','listening','demo','stopping'].includes(s.status);$('status').textContent=names[s.status]||s.status;for(const id of ['start','demo','device','refresh'])$(id).disabled=active||busy;$('stop').disabled=!active||busy;$('export').disabled=!s.history.length;$('dropped').textContent=s.dropped;
if(s.error)text($('message'),s.error);const e=s.latest;if(!e){text($('chord'),'—');text($('stability'),'等待音频');text($('level'),'— dBFS');$('meter').style.width='0%';text($('elapsed'),'00:00');$('candidates').replaceChildren();$('timeline').replaceChildren();return;}
if(e.end_time!==lastAudio){lastAudio=e.end_time;lastArrival=Date.now()}const stale=active&&Date.now()-lastArrival>1800;
text($('chord'),stale?'—':chordName(e.chord));text($('stability'),stale?'等待新音频':e.stable?'已稳定':'确认中');text($('level'),stale?'— dBFS':e.level_dbfs.toFixed(1)+' dBFS');$('meter').style.width=(stale?0:Math.max(0,Math.min(100,(e.level_dbfs+60)/60*100)))+'%';text($('elapsed'),time(e.end_time));text($('window'),`证据窗口 ${e.start_time.toFixed(1)} – ${e.end_time.toFixed(1)} 秒`);
$('candidates').replaceChildren(...(stale?[]:e.candidates).map((c,i)=>{const n=document.createElement('span');n.className='candidate';n.textContent=`${i+1}  ${chordName(c)}`;return n}));
$('timeline').replaceChildren(...s.history.map(e=>{const n=document.createElement('div');n.className='segment';n.textContent=chordName(e.chord);const t=document.createElement('small');t.textContent=time(e.end_time);n.append(t);return n}));$('timeline').scrollLeft=$('timeline').scrollWidth;
}
async function devices(){try{const s=await api('/api/devices');$('device').replaceChildren(new Option('系统默认播放设备',''),...s.devices.map(d=>new Option(d.name,d.id)));text($('message'),'')}catch(e){text($('message'),e.message+'；仍可使用演示模式。')}}
async function action(path,body){busy=true;try{lastAudio=-1;text($('message'),'');if(path==='/api/start'){text($('chord'),'—');$('candidates').replaceChildren();$('timeline').replaceChildren();text($('stability'),'等待音频')}render(await api(path,body))}catch(e){text($('message'),e.message)}finally{busy=false;if(state)render(state)}}
$('start').onclick=()=>action('/api/start',{device:$('device').value||null});$('demo').onclick=()=>action('/api/start',{demo:true});$('stop').onclick=()=>action('/api/stop',{});$('refresh').onclick=devices;
$('export').onclick=()=>{const data={schema:'chordotomy.live.history.v1',session:state.session,changes:state.history};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='harmonic-atlas-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
async function poll(){try{render(await api('/api/state'))}catch(e){text($('status'),'连接断开');text($('message'),'本机服务未连接，请检查终端。');$('start').disabled=true;$('demo').disabled=true;$('stop').disabled=true}setTimeout(poll,250)}
window.addEventListener('pagehide',()=>fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',keepalive:true}).catch(()=>{}));devices();poll();
</script></html>
